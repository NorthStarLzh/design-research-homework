<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta
name="description"
content="梳理对设计、为设计与通过设计三种研究类型，呈现逻辑关系图、论文案例与分类讨论。"
/>

<ul class="member-list" id="hero-members"></ul>
</aside>
</div>

<section class="section-shell section-tint" id="research-types" aria-labelledby="research-types-title">

<div class="section-heading">
<p class="eyebrow" id="research-types-kicker"></p>

<p class="section-intro" id="research-types-description"></p>
</div>

</div>

<div class="diagram-shell">

<p id="diagram-help" class="diagram-help"></p>
<p class="diagram-status" id="diagram-status" aria-live="polite"></p>
</div>

class="diagram-map"
id="diagram-map"
role="group"
aria-label="三种设计研究类型的逻辑关系图"
aria-describedby="diagram-help"
>
<svg
class="diagram-lines"
id="diagram-lines"
viewBox="0 0 1000 560"
preserveAspectRatio="none"
aria-hidden="true"
></svg>
<div class="diagram-nodes" id="diagram-nodes"></div>
</div>
<aside class="diagram-detail" id="diagram-detail" aria-live="polite"></aside>
<figure class="source-figure" id="logic-map-source" hidden></figure>

</div>
